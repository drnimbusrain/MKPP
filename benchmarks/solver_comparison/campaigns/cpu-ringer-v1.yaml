# Planned coverage, not admission evidence. See docs/how-to/rigorous-solver-benchmarking.md.
schema_version: 1
campaign_id: cpu-ringer-v1
version: 1.0.0
targets:
- manifest: benchmarks/solver_comparison/manifests/chapman-v1.yaml
  scenarios:
  - benchmarks/solver_comparison/scenarios/chapman-calibration-v1.yaml
  - benchmarks/solver_comparison/scenarios/chapman-measurement-v1.yaml
- manifest: benchmarks/solver_comparison/manifests/small-strato-v1.yaml
  scenarios:
  - benchmarks/solver_comparison/scenarios/small-strato-calibration-v1.yaml
  - benchmarks/solver_comparison/scenarios/small-strato-measurement-v1.yaml
- manifest: benchmarks/solver_comparison/manifests/saprc99-v1.yaml
  scenarios:
  - benchmarks/solver_comparison/scenarios/saprc99-calibration-v1.yaml
  - benchmarks/solver_comparison/scenarios/saprc99-measurement-v1.yaml
- manifest: benchmarks/solver_comparison/manifests/ts1-v1.yaml
  scenarios:
  - benchmarks/solver_comparison/scenarios/ts1-calibration-v1.yaml
  - benchmarks/solver_comparison/scenarios/ts1-measurement-v1.yaml
resources:
  primary:
    backend: cpu
    physical_cores: 1
    threads: 1
    affinity: one_physical_core
    numa_policy: local
  scaling:
    backend: cpu
    physical_cores:
    - 1
    - 2
    - 4
    threads_per_solver:
    - 1
    - 2
    - 4
    separately_labeled: true
timing_boundaries:
- steady_state_solve
- lifecycle
sampling:
  pilot_iterations: 3
  minimum_sample_seconds: 1.0
  warmups:
    minimum: 3
    maximum: 10
    stable_last_three_relative_range: 0.03
  paired_blocks: 18
  minimum_valid_blocks: 10
  ordering_seed: 1701
  bootstrap_seed: 1702
  bootstrap_resamples: 10000
output:
  raw_jsonl: benchmarks/solver_comparison/output/cpu-ringer-v1.raw.jsonl
  reports_directory: benchmarks/solver_comparison/output/cpu-ringer-v1/
publication:
  require_complete_order_cycles: true
  require_scientific_eligibility: true
  preserve_failures: true
  no_outlier_discard: true
  separate_timing_boundaries: true
input_policy:
  configuration_format: openatmos
  comparison_package: musica
  comparison_package_version: 0.16.5
  configuration_version: 1.0.0
  reject_unversioned: true
  source_comparisons:
  - benchmarks/solver_comparison/sources/ts1/v1-source-comparison.json
