[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkpp"
version = "0.1.0"
description = "Multiphase KPP (MKPP) Engine"
authors = [
    { name = "Barry Baker", email = "barry.baker@noaa.gov" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0,<7",
    "sympy>=1.12,<2",
    "jinja2>=3.1,<4",
    "networkx>=3.1,<4",
    "matplotlib>=3.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "pytest-xdist>=3.0",
    "jsonschema>=4.21,<5"
]

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
solver-comparison = [
    "musica==0.16.5",
]

[project.scripts]
mkpp = "mkpp.cli:main"
mkpp-box = "mkpp.box:main"
mkpp-compare-solvers = "mkpp.benchmark.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mkpp.benchmark" = ["contracts/*.json"]

[tool.ruff]
line-length = 132
target-version = "py311"
exclude = [".git", "__pycache__", "build", "dist", "venv", ".venv"]

[tool.ruff.lint]
# E: pycodestyle errors
# F: Pyflakes
# I: isort (import sorting)
# UP: pyupgrade
# N: pep8-naming
select = ["E", "F", "I", "UP", "N"]

# Ignore certain naming rules that conflict with standard mathematical notation.
# e.g., We want to allow matrices to be uppercase (like `J_block`, `C`, `E_matrix`)
# and constants to be uppercase.
ignore = ["N806", "N803"]

[tool.ruff.lint.per-file-ignores]
"src/mkpp/codegen.py" = ["E501"]
"src/mkpp/reporting.py" = ["E501"]
"src/mkpp/rosenbrock.py" = ["N802"]
"src/isorropialite/tests/property_variance_checker.py" = ["E501"]
"src/Cloud-J/tests/tools/run_benchmarks.py" = ["E501"]
"tests/python/test_property_lu_plan_independence.py" = ["E741"]
"tests/python/test_property_structured_errors.py" = ["E741"]
"tests/python/test_property_auto_reduction.py" = ["E501"]
"tests/python/test_transposed_lu_chapman.py" = ["N802"]
"tests/python/test_transposed_lu_plan.py" = ["N802"]
"tests/python/test_codegen.py" = ["E402"]
"tests/python/test_validation.py" = ["E402"]
"utils/benchmark_saprc99_solvers.py" = ["E402", "E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q -n auto --strict-markers"
testpaths = [
    "tests/python",
]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
