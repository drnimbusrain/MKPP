repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      # Keep this vendored MUSICA input byte-identical to its checksum-pinned source.
      - id: end-of-file-fixer
        exclude: ^benchmarks/solver_comparison/sources/ts1/musica-config/initial_conditions\.csv$
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python Formatting & Linting (using Ruff for ultra-fast performance)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # # C/C++ Formatting (Critical for Kokkos/C++ code hygiene)
  # - repo: https://github.com/pre-commit/mirrors-clang-format
  #   rev: v18.1.8
  #   hooks:
  #     - id: clang-format
  #       types_or: [c++, c, cuda]

  # CMake Formatting
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        additional_dependencies: [pyyaml]

  # Bash / Shell script Linting (Complies with Google Shell Style / EE2 standards)
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
