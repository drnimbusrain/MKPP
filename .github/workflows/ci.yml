name: MKPP CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  static-gates:
    name: 1. Static Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pre-commit
        run: pip install pre-commit

      - name: Run Pre-commit Hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Validate Semantic Versioning (SemVer)
        run: |
          python -c "
          import re, sys, tomllib
          from pathlib import Path

          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)

          version = data.get('project', {}).get('version', '')
          semver_regex = r'^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'

          if not re.match(semver_regex, version):
              print(f'::error::Version \"{version}\" in pyproject.toml is not a valid Semantic Version (SemVer 2.0.0)')
              sys.exit(1)

          print(f'✓ Version \"{version}\" in pyproject.toml is a valid Semantic Version')
          "

      - name: Validate Conventional Commits (PR Title)
        if: github.event_name == 'pull_request'
        run: |
          python -c "
          import re, sys

          pr_title = '''${{ github.event.pull_request.title }}'''
          print(f'Checking PR Title: {pr_title}')

          conv_commit_regex = r'^(feat|fix|perf|refactor|test|docs|ci|chore|build|revert)(\([a-zA-Z0-9_.-]+\))?!?: .+$'

          if not re.match(conv_commit_regex, pr_title):
              print(f'::error::PR title \"{pr_title}\" does not follow Conventional Commits specification.')
              print('::error::Format must be: <type>(<scope>): <description>')
              print('::error::Allowed types: feat, fix, perf, refactor, test, docs, ci, chore, build, revert')
              sys.exit(1)

          print('✓ PR title complies with Conventional Commits specification')
          "

  env-setup:
    name: 2. Environment Validation
    needs: static-gates
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bbakernoaa/mkpp-ci-env:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Environment (EE2 Compliance)
        run: |
          echo "Checking compilers and environment inside container..."
          python3 --version
          cmake --version
          ninja --version
          gcc --version
          gfortran --version
          echo "Kokkos installed at /opt/kokkos"
          ls /opt/kokkos/lib*/cmake/Kokkos/ || ls /opt/kokkos/lib/cmake/Kokkos/

  aot-codegen:
    name: 3. AOT Codegen & Freshness Gate
    needs: env-setup
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bbakernoaa/mkpp-ci-env:latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Mark Git Directory Safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check for Codegen-related Changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            codegen:
              - 'src/mkpp/**'
              - 'mechanisms/**'
              - 'mkpp-generated/**'
              - 'scripts/compile_all.sh'
              - 'pyproject.toml'
              - 'environment.yml'
              - '.github/workflows/ci.yml'

      - name: Install MKPP Package
        if: steps.changes.outputs.codegen == 'true'
        run: pip3 install --no-build-isolation -e .

      - name: Regenerate C++ Headers (AOT Compilation)
        if: steps.changes.outputs.codegen == 'true'
        run: |
          chmod +x ./scripts/compile_all.sh
          ./scripts/compile_all.sh

      - name: Verify Committed Headers Are Up-to-Date
        if: steps.changes.outputs.codegen == 'true'
        run: |
          if ! git diff --quiet mkpp-generated/ || [[ -n "$(git status --porcelain mkpp-generated/)" ]]; then
            echo "::error::Committed artifacts in mkpp-generated/ are stale or out-of-sync. Please regenerate locally:"
            echo "::error::  ./scripts/compile_all.sh"
            echo ""
            echo "Changed or untracked files:"
            git status --short mkpp-generated/
            git diff mkpp-generated/
            echo ""
            echo "Run './scripts/compile_all.sh' locally and commit all updated artifacts."
            exit 1
          fi
          echo "✓ mkpp-generated/ artifacts are up-to-date with codegen"

      - name: Skip Codegen Gate
        if: steps.changes.outputs.codegen != 'true'
        run: echo "✓ No codegen-related files changed; skipping AOT header regeneration."

  build-cpp:
    name: 4. C++ Core Build
    needs: aot-codegen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build CI Environment Image
        run: docker build -f .github/docker/Dockerfile.ci -t mkpp-ci-env:ci .

      - name: Configure CMake
        run: docker run --rm -v "$PWD:/workspace" -w /workspace mkpp-ci-env:ci cmake --preset default -DKokkos_ROOT=/opt/kokkos

      - name: Build C++ Core
        run: docker run --rm -v "$PWD:/workspace" -w /workspace mkpp-ci-env:ci cmake --build --preset default

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmake-build-dir
          path: build/
          retention-days: 1

  test-gates:
    name: 5. Test Gates
    needs: build-cpp
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build CI Environment Image
        run: docker build -f .github/docker/Dockerfile.ci -t mkpp-ci-env:ci .

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cmake-build-dir
          path: build/

      - name: Ensure Executable Permissions
        run: find build/ -type f -exec chmod +x {} +

      - name: Install MKPP Package
        # Must precede CTest: several CTest targets (e.g.
        # solver_benchmark_contract_admission_smoke) shell out to pytest and
        # import the mkpp package itself.  The CI image pre-bakes pytest,
        # pytest-xdist, and jsonschema; this step installs the editable mkpp
        # so PYTHONPATH-less imports resolve consistently.
        run: docker run --rm -v "$PWD:/workspace" -w /workspace mkpp-ci-env:ci pip3 install --no-build-isolation -e .

      - name: Run C++ CTests
        run: docker run --rm -v "$PWD:/workspace" -w /workspace -e PYTHONPATH="$GITHUB_WORKSPACE/src" mkpp-ci-env:ci ctest --preset default --output-on-failure

      - name: Run Python AOT Tests
        run: docker run --rm -v "$PWD:/workspace" -w /workspace -e PYTHONPATH="$GITHUB_WORKSPACE/src" mkpp-ci-env:ci pytest tests/python/ -ra -q --strict-markers

  device-gate:
    name: 6. Device Compile + Parity (optional)
    # Optional and hardware-gated: only runs on a self-hosted runner with an
    # accelerator. On ordinary host-only runners the device compile gate is not
    # built and the runtime parity test reports device-unverified, so this job
    # is allowed to be non-authoritative and never blocks a merge. The five
    # validation states (host-compiled, host-executed, device-compiled,
    # device-executed, device-unverified) are emitted by the test binaries.
    needs: test-gates
    if: ${{ vars.MKPP_DEVICE_RUNNER == 'true' }}
    runs-on: [self-hosted, gpu]
    continue-on-error: true
    container:
      image: ghcr.io/bbakernoaa/mkpp-ci-env:latest
      options: --gpus all

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Device Preset
        run: cmake --preset device -DKokkos_ROOT=/opt/kokkos

      - name: Build Device Gate
        run: cmake --build --preset device

      - name: Run Device Compile Gate + Runtime Parity
        run: ctest --test-dir build-device -R 'DeviceCompileGate|DeviceRuntimeParity' --output-on-failure
